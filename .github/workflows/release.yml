# Builds Better-Walls.exe on GitHub's Windows machines.
# - Push a tag like v1.1  -> builds and publishes a GitHub Release with the exe.
# - "Run workflow" button -> builds only; the exe is a downloadable artifact on the run page.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow

      # Compile PyInstaller's bootloader on this machine instead of using the
      # prebuilt one. The prebuilt bootloader is shared with lots of malware, so
      # antivirus engines often flag any exe that contains it.
      - name: Install PyInstaller with a freshly built bootloader
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: '1'
        run: python -m pip install --no-binary pyinstaller pyinstaller

      - name: Build exe
        env:
          BW_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0' }}
        run: pyinstaller --noconfirm wallApp.spec

      - name: Keep the exe on the run page
        uses: actions/upload-artifact@v4
        with:
          name: Better-Walls
          path: dist/Better-Walls.exe

      # Release notes are this tag's section of CHANGELOG.md (from its
      # "## vX.Y.Z" heading up to the next "## " heading).
      - name: Get release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $lines = Get-Content -Encoding utf8 CHANGELOG.md
          $start = [array]::IndexOf($lines, "## $env:GITHUB_REF_NAME")
          if ($start -lt 0) { throw "CHANGELOG.md has no '## $env:GITHUB_REF_NAME' section" }
          $notes = $lines[($start + 1)..($lines.Count - 1)]
          $end = [array]::FindIndex([string[]]$notes, [Predicate[string]]{ param($l) $l.StartsWith('## ') })
          if ($end -ge 0) { $notes = $notes[0..($end - 1)] }
          ($notes -join "`n").Trim() | Set-Content -Encoding utf8 release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME" dist/Better-Walls.exe
          --title "Better-Walls $env:GITHUB_REF_NAME"
          --notes-file release-notes.md
