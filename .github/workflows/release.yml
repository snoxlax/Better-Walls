# Builds Better-Walls.exe on GitHub's Windows machines.
# - Push a tag like v1.1  -> builds and publishes a GitHub Release with the exe.
# - "Run workflow" button -> builds only; the exe is a downloadable artifact on the run page.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm wallApp.spec

      - name: Rename to Better-Walls.exe
        run: Rename-Item dist/wallApp.exe Better-Walls.exe

      - name: Keep the exe on the run page
        uses: actions/upload-artifact@v4
        with:
          name: Better-Walls
          path: dist/Better-Walls.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME" dist/Better-Walls.exe
          --title "Better-Walls $env:GITHUB_REF_NAME"
          --generate-notes
